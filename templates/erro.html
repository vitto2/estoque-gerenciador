{% extends "base.html" %}
{% block title %}{{ titulo }} — Estoque de TI{% endblock %}

{% block content %}
<div class="estado-vazio" style="padding: 90px 24px;">
    <span class="estado-vazio-icon">{{ '🔍' if codigo == 404 else '⚠️' }}</span>
    <h3>{{ codigo }} — {{ titulo }}</h3>
    <p>{{ mensagem }}</p>
    <a href="{{ url_for('equipamentos.listagem') }}" class="btn btn-primary">Voltar ao estoque</a>
</div>
{% endblock %}
